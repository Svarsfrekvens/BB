services:
  - type: web
    name: bemanningsbalans-motor
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn bb.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: BB_MAX_OCCURRENCES
        value: "4000"
      - key: BB_MAX_SUPPORT_COMBINATIONS
        value: "250000"
      - key: BB_JOB_STORE_DIR
        value: /var/data/bb-jobs
      - key: BB_API_TOKEN
        sync: false
