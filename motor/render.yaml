services:
  - type: web
    name: bemanningsbalans-motor
    runtime: python
    region: frankfurt
    plan: 4c-8g
    branch: pilot-snapshot-2026-09-15
    autoDeployTrigger: off
    buildCommand: pip install -r motor/requirements.txt
    startCommand: cd motor && python -m uvicorn bb.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: bb-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: BB_ASYNC_JOBS
        value: "1"
      - key: BB_MAX_OCCURRENCES
        value: "4000"
      - key: BB_MAX_SUPPORT_COMBINATIONS
        value: "250000"
      - key: BB_JOB_STORE_DIR
        value: /var/data/bb-jobs
      - key: BB_API_TOKEN
        sync: false
